<!doctype html>
<html lang="tr">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xaura Asistan Demo</title>
  <style>
    :root {
      --bg: #f4f1ec;
      --surface: #ffffff;
      --ink: #1f1d1a;
      --muted: #6e6862;
      --accent: #3d5a4c;
      --accent-soft: #e3ebe6;
      --line: #e2ddd4;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 720px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--surface);
    }
    header {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header h1 { font-size: 17px; margin: 0; }
    header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
    .ghost {
      background: none;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .notice {
      margin: 12px 16px 0;
      padding: 10px 12px;
      background: var(--accent-soft);
      border-radius: 12px;
      font-size: 12.5px;
      color: var(--muted);
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: var(--radius);
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--bg); border-bottom-left-radius: 4px; }
    .msg.system { align-self: center; background: none; color: var(--muted); font-size: 13px; }
    .msg a { color: var(--accent); font-weight: 600; word-break: break-all; }
    .msg.user a { color: #fff; }
    .typing { color: var(--muted); font-style: italic; }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 12px;
    }
    .chip {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      color: var(--ink);
    }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 16px 16px;
      border-top: 1px solid var(--line);
    }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 12px 16px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button.send {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 0 20px;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Xaura Global</h1>
        <p>Yapay zeka destekli ürün asistanı · Demo</p>
      </div>
      <button class="ghost" id="reset" type="button">Yeni sohbet</button>
    </header>

    <div class="notice">
      Bu asistan bilgilendirme amaçlıdır; tıbbi tavsiye yerine geçmez. Sağlık sorunlarında hekiminize danışın.
    </div>

    <div id="log" role="log" aria-live="polite"></div>

    <div class="chips" id="chips">
      <button class="chip" type="button">Xaura kimin?</button>
      <button class="chip" type="button">Ürünler nerede üretiliyor?</button>
      <button class="chip" type="button">Bayi olmak için ne yapmalıyım?</button>
    </div>

    <form id="composer">
      <input type="text" id="input" maxlength="1000" placeholder="Mesajınızı yazın…" autocomplete="off" required>
      <button class="send" id="send" type="submit">Gönder</button>
    </form>
  </div>

  <script>
    // Başka bir alan adından yayınlanırken bot sunucusunun adresi buraya yazılır (ör. https://xxx.trycloudflare.com).
    const API_BASE = "https://bot.karacastudios.com";
    const SESSION_KEY = "xaura_demo_session";
    const REQUEST_TIMEOUT_MS = 25000;
    const log = document.getElementById("log");
    const form = document.getElementById("composer");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const chips = document.getElementById("chips");

    function newSessionId() {
      const raw = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : Date.now().toString(36) + Math.random().toString(36).slice(2);
      return raw.replace(/[^A-Za-z0-9]/g, "").slice(0, 32) || "demo" + Date.now();
    }

    function loadSessionId() {
      try {
        const saved = localStorage.getItem(SESSION_KEY);
        if (saved) return saved;
      } catch (_) { /* depolama kapalıysa her yenilemede yeni oturum */ }
      const id = newSessionId();
      try { localStorage.setItem(SESSION_KEY, id); } catch (_) {}
      return id;
    }

    let sessionId = loadSessionId();

    // http(s) bağlantılarını tıklanabilir yapar. innerHTML kullanılmaz, metin güvenle eklenir.
    const URL_PATTERN = /(https?:\/\/[^\s<>"']+[^\s<>"'.,;:!?)])/g;

    function renderText(node, text) {
      node.textContent = "";
      text.split(URL_PATTERN).forEach((part, index) => {
        if (index % 2 === 1) {
          const link = document.createElement("a");
          link.href = part;
          link.textContent = part;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          node.appendChild(link);
        } else if (part) {
          node.appendChild(document.createTextNode(part));
        }
      });
    }

    function addMessage(kind, text) {
      const node = document.createElement("div");
      node.className = "msg " + kind;
      renderText(node, text);
      log.appendChild(node);
      log.scrollTop = log.scrollHeight;
      return node;
    }

    function setBusy(busy) {
      sendBtn.disabled = busy;
      input.disabled = busy;
    }

    async function ask(message) {
      addMessage("user", message);
      const typing = addMessage("bot typing", "Yazıyor…");
      setBusy(true);
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
      try {
        const res = await fetch(API_BASE + "/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: message }),
          signal: controller.signal,
        });
        if (res.status === 429) {
          typing.textContent = "Çok hızlı mesaj gönderiyorsunuz. Lütfen biraz bekleyin.";
          return;
        }
        if (!res.ok) {
          typing.textContent = "Bir sorun oluştu. Lütfen tekrar deneyin.";
          return;
        }
        const data = await res.json();
        if (data.reply === null) {
          typing.className = "msg system";
          typing.textContent = "Bu oturum için otomatik yanıtlar durduruldu. Yeni sohbet ile tekrar deneyebilirsiniz.";
          return;
        }
        typing.className = "msg bot";
        renderText(typing, data.reply);
      } catch (err) {
        typing.textContent = err.name === "AbortError"
          ? "Yanıt biraz gecikti. Lütfen mesajınızı tekrar gönderin."
          : "Bağlantı kurulamadı. Lütfen tekrar deneyin.";
      } finally {
        clearTimeout(timer);
        setBusy(false);
        input.focus();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      ask(message);
    });

    chips.addEventListener("click", (event) => {
      const target = event.target.closest(".chip");
      if (target && !sendBtn.disabled) ask(target.textContent);
    });

    document.getElementById("reset").addEventListener("click", () => {
      try { localStorage.removeItem(SESSION_KEY); } catch (_) {}
      sessionId = loadSessionId();
      log.innerHTML = "";
      addMessage("system", "Yeni bir sohbet başladı.");
    });

    addMessage("bot", "Merhaba, hoş geldiniz! 😊 Ben Xaura Global'in yapay zeka asistanıyım. Sağlığınız, cildiniz ya da günlük enerjiniz için size yardımcı olabilirim. Ne hakkında konuşalım?");
  </script>
</body>
</html>
