<!doctype html>
<html lang="tr">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xaura Asistan · Demo</title>
  <style>
    :root {
      --bg: #f4f1ec;
      --surface: #ffffff;
      --ink: #1f1d1a;
      --muted: #6e6862;
      --accent: #3d5a4c;
      --accent-hover: #2f473c;
      --accent-soft: #e6eee9;
      --line: #e4dfd6;
      --shadow: 0 1px 2px rgba(31, 29, 26, 0.05), 0 6px 20px rgba(31, 29, 26, 0.06);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      width: 100%;
      max-width: 760px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    @media (min-width: 800px) {
      body { padding: 24px 0; }
      .app { height: calc(100% - 48px); border-radius: 20px; overflow: hidden; border: 1px solid var(--line); }
    }

    /* Üst bölüm */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark {
      width: 40px; height: 40px; flex: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700;
    }
    .brand-name { font-size: 15px; font-weight: 600; }
    .brand-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; display: flex; align-items: center; gap: 6px; }
    .live { width: 7px; height: 7px; border-radius: 50%; background: #4f9a6e; display: inline-block; }
    .ghost {
      font: inherit; font-size: 13px; font-weight: 500;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .ghost:hover { background: #faf8f5; }

    /* Bilgi şeridi */
    .notice {
      margin: 12px 18px 0;
      padding: 10px 14px;
      background: var(--accent-soft);
      border-radius: 12px;
      font-size: 12.5px;
      line-height: 1.5;
      color: #3e4a44;
    }

    /* Mesajlar */
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .row { display: flex; align-items: flex-end; gap: 10px; max-width: 100%; }
    .row.user { justify-content: flex-end; }
    .avatar {
      width: 28px; height: 28px; flex: none;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
    }
    .msg {
      max-width: min(78%, 560px);
      padding: 11px 15px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
      box-shadow: 0 1px 1px rgba(31, 29, 26, 0.04);
    }
    .msg.user { background: var(--accent); color: #fff; border-bottom-right-radius: 6px; }
    .msg.bot { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
    .msg.system {
      align-self: center;
      background: none;
      box-shadow: none;
      color: var(--muted);
      font-size: 13px;
      padding: 4px 8px;
      text-align: center;
    }
    .msg a { color: var(--accent); font-weight: 600; word-break: break-all; }
    .msg.user a { color: #fff; }

    /* Yazıyor göstergesi */
    .dots { display: inline-flex; gap: 5px; padding: 4px 2px; }
    .dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      opacity: 0.35;
      animation: blink 1.2s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }
    @media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: 0.6; } #log { scroll-behavior: auto; } }

    /* Hazır sorular */
    .chips {
      display: flex;
      gap: 8px;
      padding: 0 18px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none;
      font: inherit; font-size: 13px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      color: var(--ink);
      transition: border-color 0.15s, background 0.15s;
    }
    .chip:hover { border-color: var(--accent); background: var(--accent-soft); }

    /* Giriş alanı */
    form {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px 18px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      font: inherit; font-size: 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 13px 16px;
      background: #fcfbf9;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    input[type="text"]:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(61, 90, 76, 0.12); }
    button.send {
      flex: none;
      width: 48px; height: 48px;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    button.send:hover { background: var(--accent-hover); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled, input:disabled { opacity: 0.55; cursor: default; }

    @media (max-width: 520px) {
      header { padding: 12px 14px; }
      .brand-sub { display: none; }
      .notice { margin: 10px 14px 0; }
      #log { padding: 14px; }
      .msg { max-width: 84%; }
      .chips { padding: 0 14px 10px; }
      form { padding: 10px 14px 14px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="mark" aria-hidden="true">X</div>
        <div>
          <div class="brand-name">Xaura Global</div>
          <div class="brand-sub"><span class="live" aria-hidden="true"></span>Yapay zeka destekli ürün asistanı</div>
        </div>
      </div>
      <button class="ghost" id="reset" type="button">Yeni sohbet</button>
    </header>

    <div class="notice">
      Bu asistan bilgilendirme amaçlıdır; tıbbi tavsiye yerine geçmez. Sağlık sorunlarında hekiminize danışın.
    </div>

    <div id="log" role="log" aria-live="polite"></div>

    <div class="chips" id="chips">
      <button class="chip" type="button">Xaura kimin?</button>
      <button class="chip" type="button">Ürünler nerede üretiliyor?</button>
      <button class="chip" type="button">Bayi olmak için ne yapmalıyım?</button>
    </div>

    <form id="composer">
      <input type="text" id="input" maxlength="1000" placeholder="Mesajınızı yazın…" autocomplete="off" aria-label="Mesajınız" required>
      <button class="send" id="send" type="submit" aria-label="Gönder">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </form>
  </div>

  <script>
    // Başka bir alan adından yayınlanırken bot sunucusunun adresi buraya yazılır (ör. https://xxx.trycloudflare.com).
    const API_BASE = "https://bot.karacastudios.com";
    const SESSION_KEY = "xaura_demo_session";
    const REQUEST_TIMEOUT_MS = 25000;
    const log = document.getElementById("log");
    const form = document.getElementById("composer");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const chips = document.getElementById("chips");

    function newSessionId() {
      const raw = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : Date.now().toString(36) + Math.random().toString(36).slice(2);
      return raw.replace(/[^A-Za-z0-9]/g, "").slice(0, 32) || "demo" + Date.now();
    }

    function loadSessionId() {
      try {
        const saved = localStorage.getItem(SESSION_KEY);
        if (saved) return saved;
      } catch (_) { /* depolama kapalıysa her yenilemede yeni oturum */ }
      const id = newSessionId();
      try { localStorage.setItem(SESSION_KEY, id); } catch (_) {}
      return id;
    }

    let sessionId = loadSessionId();

    // http(s) bağlantılarını tıklanabilir yapar. innerHTML kullanılmaz, metin güvenle eklenir.
    const URL_PATTERN = /(https?:\/\/[^\s<>"']+[^\s<>"'.,;:!?)])/g;

    function renderText(node, text) {
      node.textContent = "";
      text.split(URL_PATTERN).forEach((part, index) => {
        if (index % 2 === 1) {
          const link = document.createElement("a");
          link.href = part;
          link.textContent = part;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          node.appendChild(link);
        } else if (part) {
          node.appendChild(document.createTextNode(part));
        }
      });
    }

    function typingDots() {
      const dots = document.createElement("span");
      dots.className = "dots";
      dots.setAttribute("aria-label", "Yazıyor");
      for (let i = 0; i < 3; i++) dots.appendChild(document.createElement("span"));
      return dots;
    }

    // Mesajı satır içinde ekler: bot mesajlarında avatar, kullanıcı mesajlarında sağ hizalama.
    function addMessage(kind, text) {
      const isUser = kind.startsWith("user");
      const row = document.createElement("div");
      row.className = "row" + (isUser ? " user" : "");
      if (!isUser && kind.startsWith("bot")) {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.setAttribute("aria-hidden", "true");
        avatar.textContent = "X";
        row.appendChild(avatar);
      }
      const node = document.createElement("div");
      node.className = "msg " + kind;
      if (kind === "bot typing") node.appendChild(typingDots());
      else renderText(node, text);
      row.appendChild(node);
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
      return node;
    }

    function setBusy(busy) {
      sendBtn.disabled = busy;
      input.disabled = busy;
    }

    async function ask(message) {
      addMessage("user", message);
      const typing = addMessage("bot typing", "");
      setBusy(true);
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
      try {
        const res = await fetch(API_BASE + "/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: message }),
          signal: controller.signal,
        });
        if (res.status === 429) {
          typing.className = "msg system";
          typing.textContent = "Çok hızlı mesaj gönderiyorsunuz. Lütfen biraz bekleyin.";
          return;
        }
        if (!res.ok) {
          typing.className = "msg system";
          typing.textContent = "Bir sorun oluştu. Lütfen tekrar deneyin.";
          return;
        }
        const data = await res.json();
        if (data.reply === null) {
          typing.className = "msg system";
          typing.textContent = "Bu oturum için otomatik yanıtlar durduruldu. Yeni sohbet ile tekrar deneyebilirsiniz.";
          return;
        }
        typing.className = "msg bot";
        renderText(typing, data.reply);
      } catch (err) {
        typing.className = "msg system";
        typing.textContent = err.name === "AbortError"
          ? "Yanıt biraz gecikti. Lütfen mesajınızı tekrar gönderin."
          : "Bağlantı kurulamadı. Lütfen tekrar deneyin.";
      } finally {
        clearTimeout(timer);
        setBusy(false);
        input.focus();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      ask(message);
    });

    chips.addEventListener("click", (event) => {
      const target = event.target.closest(".chip");
      if (target && !sendBtn.disabled) ask(target.textContent);
    });

    document.getElementById("reset").addEventListener("click", () => {
      try { localStorage.removeItem(SESSION_KEY); } catch (_) {}
      sessionId = loadSessionId();
      log.innerHTML = "";
      addMessage("system", "Yeni bir sohbet başladı.");
      addMessage("bot", WELCOME);
    });

    const WELCOME = "Merhaba, hoş geldiniz! 😊 Ben Xaura Global'in yapay zeka asistanıyım. Sağlığınız, cildiniz ya da günlük enerjiniz için size yardımcı olabilirim. Ne hakkında konuşalım?";
    addMessage("bot", WELCOME);
  </script>
</body>
</html>
